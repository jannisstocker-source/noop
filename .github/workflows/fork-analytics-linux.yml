# Fork-only: run the StrandAnalytics tests on Linux, because hosted macOS arm64 runners often
# never get acquired for this fork. Trigger from the Actions tab.
name: Analytics tests (Linux, fork)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install SQLite headers (GRDB)
        run: apt-get update -q && apt-get install -y -q libsqlite3-dev
      - name: swift test
        working-directory: Packages/StrandAnalytics
        shell: bash
        run: set -o pipefail; swift test 2>&1 | tee test.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-test-log
          path: Packages/StrandAnalytics/test.log
